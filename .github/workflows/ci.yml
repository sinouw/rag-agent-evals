name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  retrieval-eval:
    name: Retrieval eval (no API key)
    needs: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - run: uv sync --frozen
      - run: uv run python -m app.ingest
      - run: uv run python -m evals.run --retrieval-only --min-hit-rate 0.9 --out "$RUNNER_TEMP/eval"
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-eval
          path: ${{ runner.temp }}/eval

  agent-eval:
    name: Agent eval (LLM-as-judge)
    # Runs only where a provider key is configured, and not on pull requests from forks.
    needs: retrieval-eval
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'groq' }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      JUDGE_PROVIDER: ${{ vars.JUDGE_PROVIDER }}
      JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed
    steps:
      - name: Check for an API key
        id: key
        run: |
          if [ -n "$GROQ_API_KEY$GEMINI_API_KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "No LLM API key secret; skipping."; fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
      - uses: astral-sh/setup-uv@v6
        if: steps.key.outputs.present == 'true'
        with:
          enable-cache: true
      - uses: actions/cache@v4
        if: steps.key.outputs.present == 'true'
        with:
          path: .cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - if: steps.key.outputs.present == 'true'
        run: |
          uv sync --frozen
          uv run python -m app.ingest
          # Add --min-correctness / --min-faithfulness gates once a real baseline exists.
          uv run python -m evals.run --out "$RUNNER_TEMP/eval"
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.present == 'true' && always()
        with:
          name: agent-eval
          path: ${{ runner.temp }}/eval

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker images build
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
