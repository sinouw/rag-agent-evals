services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "6333:6333"

  jaeger:
    # Trace UI at http://localhost:16686; receives OTLP over HTTP on :4318.
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "16686:16686"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      SQLITE_PATH: /app/data/state/metadata.db
      CORPUS_DIR: /app/data/corpus
      TRACE_LOG_PATH: /app/data/state/traces.jsonl
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      - qdrant
      - jaeger
    volumes:
      - api-data:/app/data/state
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  qdrant-data:
  api-data:
